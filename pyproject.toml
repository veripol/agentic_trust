[project]
name = "agentic-trust"
version = "0.1.0"
description = "Do AI agents follow UX trust criteria under pressure? Multi-agent scenarios scored from tool calls."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1,<3",
    "langgraph>=1.2,<2",
    "jsonschema>=4.23,<5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_trust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
